name: Release

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish to GitHub Release, then deploy to production server 43.166.161.102 (true/false)"
        required: false
        default: "true"
        type: boolean

env:
  SECRET_KEY_BASE: ci-build-secret-key-base-not-for-production

jobs:
  release:
    name: Build, publish and deploy Linux amd64 release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0.1"
          elixir-version: "1.20.0-otp-29"
          version-type: strict

      # No actions/cache here: caches count against the 0.5 GB Actions
      # storage quota. deps.get re-downloads every run instead.
      - name: Install dependencies
        run: mix deps.get

      # The app must be compiled before assets: app.css imports
      # "phoenix-colocated/writing/colocated.css", which the phoenix_live_view
      # compiler writes into _build/prod/phoenix-colocated/ during app compile.
      - name: Compile application
        env:
          MIX_ENV: prod
        run: mix compile

      # /priv/static/assets and cache_manifest.json are gitignored, so they must
      # be built here or the deployed release ships without CSS/JS.
      - name: Build production assets
        env:
          MIX_ENV: prod
        run: mix assets.deploy

      # NOTE: there is no `mix release.tar` task in Elixir 1.20, so the release
      # is assembled with `mix release` and then tarred by hand. `tar ... -C <dir> .`
      # keeps the release root at the tarball root, which is what the playbook's
      # unarchive + `{{ release_directory }}/bin/writing` expects.
      - name: Build production release and tarball
        id: release-version
        env:
          MIX_ENV: prod
        # Filter the known third-party deprecation warning emitted by deps that
        # still use `xref: [exclude: ...]` in their own mix.exs (postgrex,
        # phoenix_ecto, phoenix_live_dashboard have no migrated release yet).
        # Remove this filter once upstream migrates to `elixirc_options`.
        run: |
          set -o pipefail
          mix release --overwrite 2>&1 | perl -ne '
            if (/in your mix\.exs file is deprecated/) { $skip = 1; next }
            if ($skip && /^  \(mix \d+\.\d+\.\d+\) lib\/mix\//) { next }
            $skip = 0; print
          '

          # Read the version from the generated .app file rather than mix.exs,
          # so formatting changes in mix.exs cannot break the release.
          version="$(sed -n 's/.*vsn,"\([^"]*\)".*/\1/p' _build/prod/lib/writing/ebin/writing.app)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          tar czf "_build/prod/writing-${version}.tar.gz" -C _build/prod/rel/writing .

      - name: Stage release assets for deploy
        id: release-asset
        env:
          VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          tarball="_build/prod/writing-${VERSION}.tar.gz"
          test -f "$tarball"
          # The overlay script is what the systemd unit's ExecStart calls.
          tar -tzf "$tarball" | grep -E '^\./?bin/(server|writing)$'
          mkdir -p release-assets
          cp "$tarball" "release-assets/writing-${VERSION}.tar.gz"
          # Checksum must reference the bare filename: on the target node both
          # files are copied flat into the download directory before verification.
          (cd release-assets && sha256sum "writing-${VERSION}.tar.gz" > SHA256SUMS)
          printf 'tarball=writing-%s.tar.gz\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release-version.outputs.version }}
          TARBALL: ${{ steps.release-asset.outputs.tarball }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "release-assets/$TARBALL" release-assets/SHA256SUMS --clobber
          else
            gh release create "$VERSION" --title "$VERSION" \
              "release-assets/$TARBALL" release-assets/SHA256SUMS
          fi

      # Deploy happens in this same job so the playbook's control node already
      # has release-assets/ locally; ansible copy ships it over scp. This avoids
      # Actions artifacts entirely (they count against the 0.5 GB quota).
      - name: Set up Python
        if: ${{ github.event.inputs.deploy != 'false' }}
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ansible
        if: ${{ github.event.inputs.deploy != 'false' }}
        run: pip install ansible

      - name: Write vault password
        if: ${{ github.event.inputs.deploy != 'false' }}
        run: |
          echo "${{ secrets.VAULT_PASS }}" > deploy/.vault_pass
          chmod 600 deploy/.vault_pass

      - name: Set up SSH key
        if: ${{ github.event.inputs.deploy != 'false' }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 43.166.161.102 >> ~/.ssh/known_hosts

      - name: Deploy release to server
        if: ${{ github.event.inputs.deploy != 'false' }}
        env:
          VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          cd deploy
          ansible-playbook deploy.yml -i inventory.ini -e "release_version=${VERSION}"
